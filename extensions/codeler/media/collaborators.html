<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
<script type="application/json" id="data">{{data}}</script>
<div class="list" id="list"></div>
<script nonce="{{nonce}}" src="{{js}}"></script>
<script nonce="{{nonce}}">
let followingUserId = data.followingUserId;
const draw = people => { const list = document.getElementById('list'); list.replaceChildren(...people.map(p => el('div', { class: 'item' }, avatar(p, p.online),
		el('div', { class: 'grow' }, el('div', {}, p.name), el('div', { class: 'sub' }, p.file ? `${p.online ? 'Online' : 'Offline'} · ${p.file}:${(p.cursorLine ?? 0)}` : (p.online ? 'Online' : 'Offline'))),
		p.isMe || !p.userId ? null : el('button', { class: 'btn-ghost', 'aria-pressed': followingUserId === p.userId ? 'true' : 'false', onclick: () => followingUserId === p.userId ? vscode.postMessage({ type: 'stopFollowing' }) : vscode.postMessage({ type: 'follow', userId: p.userId }) }, followingUserId === p.userId ? 'Following' : 'Follow')))); };
draw(data.people);
onCodelerMessage(m => { if (m.type === 'presence') { followingUserId = m.followingUserId; draw(m.people); } });
</script>
</body>
</html>
