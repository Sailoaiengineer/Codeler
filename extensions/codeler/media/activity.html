<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
<script type="application/json" id="data">{{data}}</script>
<div class="list" id="list" role="log"></div>
<script nonce="{{nonce}}" src="{{js}}"></script>
<script nonce="{{nonce}}">
const list = document.getElementById('list');
const row = a => {
	const p = personOf(a);
	return el('div', { class: 'item' }, avatar(p),
		el('div', { class: 'grow' }, el('div', {}, el('b', {}, p.name), ' ', a.text), el('div', { class: 'sub' }, a.time)));
};
const draw = items => list.replaceChildren(...(items.length ? items.map(row) : [el('div', { style: 'opacity:.6;padding:12px;' }, 'No activity yet.')]));
draw(data.activity);
onCodelerMessage(m => {
	if (m.type === 'activity') draw(m.items);
	if (m.type === 'live' && !m.on) draw(data.activity);
});
vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
