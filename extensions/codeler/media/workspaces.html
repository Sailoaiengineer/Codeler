<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<link rel="stylesheet" href="{{css}}">
</head>
<body>
<script type="application/json" id="data">{{data}}</script>
<div class="list" id="list"></div>
<script nonce="{{nonce}}" src="{{js}}"></script>
<script nonce="{{nonce}}">
for (const t of data.teams)
	document.getElementById('list').append(el('div', { class: 'item' },
		el('div', { class: 'grow' }, el('div', {}, t.name), el('div', { class: 'sub' }, `${t.projects.length} project · ${t.role}`)),
		t.pending ? el('span', { class: 'pill', title: 'Waiting for approval' }, `${t.pending} waiting`) : null));
</script>
</body>
</html>
