<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="{{csp}}"><link rel="stylesheet" href="{{css}}"></head>
<body><script type="application/json" id="data">{{data}}</script><div class="list" id="list"></div>
<script nonce="{{nonce}}" src="{{js}}"></script><script nonce="{{nonce}}">
const list = document.getElementById('list');
function draw(teams) { if (!teams.length) { list.replaceChildren(el('div', { style: 'opacity:.6;padding:12px;' }, 'No teams yet. Sign in to create or join one.')); return; } list.replaceChildren(...teams.map(t => el('div', { class: 'workspace-team' }, el('div', { class: 'item' }, t.imageUrl ? el('img', { src: t.imageUrl, alt: '', style: 'width:32px;height:32px;border-radius:6px;object-fit:cover' }) : null, el('div', { class: 'grow' }, el('div', {}, t.name), el('div', { class: 'sub' }, `${(t.projects ?? []).length} projects · ${t.role}`)), t.waiting ? el('span', { class: 'pill' }, `${t.waiting} waiting`) : null), ...(t.status === 'active' ? (t.projects ?? []).map(p => el('button', { class: 'btn-ghost project', type: 'button', onclick: () => vscode.postMessage({ type: 'project', projectId: p.id, projectName: p.name }) }, p.name)) : []), t.teamId && t.status === 'active' && (t.role === 'owner' || t.role === 'admin') ? el('button', { class: 'btn-outline', type: 'button', onclick: () => vscode.postMessage({ type: 'newProject', teamId: t.teamId, projectCount: (t.projects ?? []).length }) }, 'New project') : null, t.joinCode ? el('div', { class: 'sub' }, `Join code: ${t.joinCode}`) : null))); }
draw(data.teams); onCodelerMessage(m => { if (m.type === 'teamData') draw(m.signedIn ? (m.teams ?? []) : data.teams); }); vscode.postMessage({ type: 'ready' });
</script></body></html>
