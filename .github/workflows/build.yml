name: Build Codeler

on:
  workflow_dispatch: {}
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  APP_NAME: Codeler
  BINARY_NAME: codeler
  ORG_NAME: Codeler
  VSCODIUM_COMMIT: ca7f7b44b5e5c3faa663f6cdc043998f71936653

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      VSCODE_ARCH: x64
      # .msi needs WiX; ship the Inno Setup installers only (same as scripts/build-windows.sh)
      SHOULD_BUILD_MSI: "no"
      SHOULD_BUILD_MSI_NOUP: "no"
      # Signing runs only once the SignPath secrets exist (after SignPath approves the project).
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clone pinned VSCodium
        run: |
          git clone https://github.com/VSCodium/vscodium.git vscodium
          git -C vscodium checkout "$VSCODIUM_COMMIT"
      - name: Apply Codeler build inputs
        run: |
          mkdir -p vscodium/patches/user
          cp patches/codeler-core.patch vscodium/patches/user/codeler-core.patch
          git -C vscodium apply ../patches/vscodium-build.patch
          python -I brand/make_icons.py
      - name: Build Windows installer
        run: bash ./vscodium/dev/build.sh -p
      # SignPath only signs files that were stored as a GitHub artifact by this workflow.
      - name: Upload unsigned installers
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeler-windows-x64-unsigned
          path: vscodium/assets/*.exe
          retention-days: 1
      - name: Sign installers (SignPath, approved by hand)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # up to 8 h to approve the request on signpath.io
          wait-for-completion-timeout-in-seconds: 28800
          output-artifact-directory: vscodium/assets/
      - name: Upload Windows installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeler-windows-x64
          path: vscodium/assets/*.exe

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      VSCODE_ARCH: ${{ matrix.arch }}
      # Placeholders for a future Apple signing/notarization integration.
      CODELER_APPLE_SIGNING_IDENTITY: ${{ secrets.CODELER_APPLE_SIGNING_IDENTITY }}
      CODELER_APPLE_NOTARIZATION_PROFILE: ${{ secrets.CODELER_APPLE_NOTARIZATION_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clone pinned VSCodium
        run: |
          git clone https://github.com/VSCodium/vscodium.git vscodium
          git -C vscodium checkout "$VSCODIUM_COMMIT"
      - name: Apply Codeler build inputs
        run: |
          mkdir -p vscodium/patches/user
          cp patches/codeler-core.patch vscodium/patches/user/codeler-core.patch
          git -C vscodium apply ../patches/vscodium-build.patch
          python -I brand/make_icons.py
      - name: Build macOS package
        run: bash ./vscodium/dev/build.sh -p
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: codeler-macos-${{ matrix.arch }}
          path: |
            vscodium/assets/**
            vscodium/VSCode-darwin-${{ matrix.arch }}/**

  linux:
    runs-on: ubuntu-22.04
    env:
      VSCODE_ARCH: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clone pinned VSCodium
        run: |
          git clone https://github.com/VSCodium/vscodium.git vscodium
          git -C vscodium checkout "$VSCODIUM_COMMIT"
      - name: Apply Codeler build inputs
        run: |
          mkdir -p vscodium/patches/user
          cp patches/codeler-core.patch vscodium/patches/user/codeler-core.patch
          git -C vscodium apply ../patches/vscodium-build.patch
          python -I brand/make_icons.py
      - name: Build Linux package
        run: bash ./vscodium/dev/build.sh -p
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: codeler-linux-x64
          path: |
            vscodium/assets/**
            vscodium/VSCode-linux-x64/**
